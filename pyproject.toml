[project]
name = "mle-fine-tuning-small-models"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "accelerate>=1.12.0",
    "numpy>=2.3.5",
    "openai>=2.38.0",
    "peft>=0.19.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.5.1",
    "torch>=2.12.0",
    "transformers>=4.57.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
